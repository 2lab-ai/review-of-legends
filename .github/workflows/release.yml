name: Release

# Stable channel. Push a tag vMAJOR.MINOR.PATCH on a commit of main (see
# AGENTS.md "Release"): this publishes the source archive, SHA256SUMS and the
# `review-of-legends` formula, then (opt-in) refreshes the tap. Deployments pin
# stable releases only.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    # Nothing is published unless the suite passes on the daemon's minimum
    # Python (3.9) and the current one.
    strategy:
      matrix:
        python: ['3.9', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate the tag
        id: plan
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::$tag is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$tag must point at a commit on main"; exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - name: Build archive and formula
        run: python scripts/package-release.py "${{ steps.plan.outputs.version }}" --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS dist/review-of-legends.rb \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

  tap:
    needs: [build, publish]
    # Opt-in, as in preview.yml.
    if: vars.ROL_TAP_REPOSITORY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Push the stable formula
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
          TAP: ${{ vars.ROL_TAP_REPOSITORY }}
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo "::error::TAP_DISPATCH_TOKEN is not set"; exit 1; }
          gh auth setup-git
          git clone --depth 1 "https://github.com/$TAP.git" tap
          cp dist/review-of-legends.rb tap/Formula/review-of-legends.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/review-of-legends.rb
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "review-of-legends $GITHUB_REF_NAME"
          for attempt in 1 2 3; do
            git push origin HEAD && exit 0
            git pull --rebase origin HEAD
          done
          echo "::error::could not push the formula to $TAP"; exit 1
